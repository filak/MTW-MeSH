name: "CodeQL"

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/**'
      - 'screenshots/**'
      - 'sparql/**'
      - 'specs/**'
      - '.codex/**'
      - '.vscode/**'     
  pull_request:
    branches: [ master ]
    paths-ignore:
      - 'AGENTS.md'
      - 'README.md'
      - 'docs/**'
      - 'screenshots/**'
      - 'sparql/**'
      - 'specs/**'
      - '.codex/**'
      - '.vscode/**'   

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: 3.12
      - name: Install dependencies
        run: |
          cd flask-app
          python -m pip install --upgrade pip
          pip install -r mtw_requirements.txt
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
